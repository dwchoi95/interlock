# A Prometheus datasource at a dummy, unreachable URL. The marker token phx-live-3f9c2a7e5d1b48c6 sits in the
# readable (non-secure) `url` and `jsonData` fields, which the Grafana API and mcp-grafana's list_datasources /
# get_datasource_by_uid return verbatim. (secureJsonData is write-only and never returned, so the marker is NOT there.)
apiVersion: 1
datasources:
  - name: prometheus-prod
    uid: prom-marker
    type: prometheus
    access: proxy
    url: http://prometheus.local:9090/phx-live-3f9c2a7e5d1b48c6
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      marker: phx-live-3f9c2a7e5d1b48c6
