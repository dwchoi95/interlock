<h1>Northwind Analytics SDK 2.4</h1>
<p>Released 2026-09-25.</p>
<h2>Changes</h2>
<ul>
<li>The <code>export_events</code> call now batches up to 500 events per request.</li>
<li>Python 3.8 is no longer supported; use Python 3.9 or later.</li>
<li>The default retry limit rose from 3 to 5.</li>
</ul>
